<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Assistant</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Your AI Study GURU 😌</h1>

    <form method="POST" class="form">

    <select name="subject" class="subject-select">
        <option value="General">General</option>
        <option value="Math">Math</option>
        <option value="Science">Science</option>
        <option value="Coding">Coding</option>
        <option value="English">English</option>
        <option value="History">History</option>
    </select>

    <select name="answer_style" class="subject-select">
        <option value="Simple explanation">Simple</option>
        <option value="Step-by-step explanation">Step-by-step</option>
        <option value="Short study notes">Short notes</option>
        <option value="Quiz format">Quiz me</option>
    </select>

    <label for="search" class="search-box">
        <input
            class="input"
            type="text"
            name="question"
            required
            placeholder="Ask something..."
            id="search"
        >

        <div class="fancy-bg"></div>

        <div class="search">
            <!-- keep your search svg here -->
        </div>

        <button class="close-btn" type="reset">
            <!-- keep your close svg here -->
        </button>
    </label>

    <button type="submit" class="ask-btn">Ask AI</button>

</form>

{% if history %}
    {% for item in history %}
        <div class="response-box">
            <h2>Your Question</h2>
            <p>{{ item.question }}</p>

            <h2>Answer</h2>
            <p>{{ item.answer }}</p>
        </div>
    {% endfor %}
{% endif %}

{% if response %}
    <div class="response-box">
        <h2>Your Question</h2> 
        <p>{{ question }}</p>

        <h2>Answer</h2>
        <p>{{ response }}</p>
    </div>
{% endif %}

</body>

</html>
